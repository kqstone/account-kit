name: release

# Push a tag `v<version>` (e.g. v0.1.0) to publish:
#   - Python package `account-kit` -> PyPI (Trusted Publishing, no token)
#   - @kqstone/account-ui-vue and @kqstone/account-ui-react -> GitHub Packages
# The tag version must equal the version in pyproject.toml and both package.json files.
# A manual run (workflow_dispatch) on a branch only runs the checks and builds;
# the publish jobs run only for `v*` tag refs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Tag, pyproject.toml and package.json versions must match
        run: |
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          vue=$(node -p "require('./packages/account-ui-vue/package.json').version")
          react=$(node -p "require('./packages/account-ui-react/package.json').version")
          echo "pyproject.toml:      $py"
          echo "account-ui-vue:      $vue"
          echo "account-ui-react:    $react"
          if [ "$py" != "$vue" ] || [ "$py" != "$react" ]; then
            echo "::error::pyproject.toml ($py), account-ui-vue ($vue) and account-ui-react ($react) versions differ"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag:                 $tag"
            if [ "$tag" != "$py" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package version $py"
              exit 1
            fi
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"

  python:
    name: Python tests and build
    needs: version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
      - name: Test
        env:
          ACCOUNT_KIT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_kit_test
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  npm:
    name: npm build
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [account-ui-vue, account-ui-react]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install (prepare builds dist/)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pack (dry run)
        run: npm pack --dry-run

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, python, npm]
    runs-on: ubuntu-latest
    # Must match the environment in PyPI's trusted publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/account-kit/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740 attestations would publish this private repo's name and
          # workflow to the public Sigstore log and PyPI's provenance view.
          # Remove this line once the repo is public.
          attestations: false

  publish-npm:
    name: Publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, python, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@kqstone"
      # Auth uses the workflow GITHUB_TOKEN (packages: write). No NPM_TOKEN secret.
      #
      # To move these packages to npmjs.com later:
      #   1. Change publishConfig.registry to the default (or remove it) and keep access: public.
      #   2. Point setup-node registry-url at https://registry.npmjs.org (drop scope if unused).
      #   3. Publish with NODE_AUTH_TOKEN from secrets.NPM_TOKEN, or switch to npm trusted
      #      publishing (OIDC: npm >= 11.5.1, id-token: write; no --provenance while private).
      #   4. Update README install / .npmrc instructions.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in account-ui-vue account-ui-react; do
            (
              cd "packages/$pkg"
              npm ci
              name=$(node -p "require('./package.json').name")
              version=$(node -p "require('./package.json').version")
              if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
                echo "$name@$version is already on GitHub Packages; skipping"
              else
                npm publish --access public
              fi
            )
          done
