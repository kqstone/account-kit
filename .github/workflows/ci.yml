name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Kit tests and demo smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Kit tests
        env:
          ACCOUNT_KIT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_kit_test
        run: python -m pytest -q
      - name: Demo smoke
        env:
          ACCOUNT_KIT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_kit_test
          DEMO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_kit_test
        run: python -m pytest examples/demo/tests -q
      - name: Demo stays out of the wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel"
          names = zipfile.ZipFile(wheels[0]).namelist()
          leaked = [n for n in names if n.startswith("examples/") or "/examples/" in n]
          assert not leaked, leaked
          print("wheel ok", wheels[0].name)
          PY

  web:
    name: UI packages and demo frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build UI packages and check npm pack
        run: |
          for p in vue react; do
            (cd packages/account-ui-$p && npm ci && npm run build && npm pack --dry-run --json > /tmp/pack-$p.json)
            ! grep -q '"path": *"examples' /tmp/pack-$p.json
          done
      - name: Build demo frontends
        run: |
          for w in vue react; do
            (cd examples/demo/web-$w && npm ci && npm run build)
          done
