<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>管理员您好！</h3>
        <p><strong>{{ brand }}</strong> 有新用户待审批。</p>
        <p>用户名：{{ username }}</p>
        <p>邮箱：{{ email }}</p>
        {% if via %}<p>来源：{{ via }}</p>{% endif %}
        {% if public_base_url %}<p>管理后台：{{ public_base_url }}</p>{% endif %}
        <div class="footer">
            <p>本邮件由 {{ brand }} 系统自动发送，请勿直接回复。</p>
        </div>
    </div>
</body>
</html>
