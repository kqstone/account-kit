<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>Hello admin,</h3>
        <p>A new <strong>{{ brand }}</strong> user is waiting for approval.</p>
        <p>Username: {{ username }}</p>
        <p>Email: {{ email }}</p>
        {% if via %}<p>Source: {{ via }}</p>{% endif %}
        {% if public_base_url %}<p>Admin: {{ public_base_url }}</p>{% endif %}
        <div class="footer">
            <p>This email was sent automatically by {{ brand }}. Please do not reply.</p>
        </div>
    </div>
</body>
</html>
