<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .code { color: #4CAF50; font-size: 24px; font-weight: bold; margin: 20px 0; }
        .warn { color: #c0392b; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>尊敬的用户，您好！</h3>
        <p>您正在<strong>登录账号</strong>（使用邮箱代替两步验证），您的验证码是：</p>
        <div class="code">{{ code }}</div>
        <p>该验证码在 5 分钟内有效。请勿将此验证码泄露给他人。</p>
        <p class="warn">如果这不是您的操作，说明您的密码可能已泄露，请立即修改密码。</p>
        <div class="footer">
            <p>本邮件由 {{ brand }} 系统自动发送，请勿直接回复。</p>
        </div>
    </div>
</body>
</html>
